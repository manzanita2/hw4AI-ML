# Roofline config for the M4 accelerator, consumed by tools/roofplot/roofplot.py:
#
#   python3 tools/roofplot/roofplot.py --config project/m4/bench/roofline_final.yml
#
# Output (plot.output, resolved relative to this file) -> roofline_final.png.
# Every number traces to bench/benchmark_data.csv (generated by benchmark.py).
#
# Hardware roof is the ACCELERATOR: 256 MACs/cycle * 2 FLOP * 100 MHz = 51.2
# GFLOP/s peak; its binding memory roof is the AXIS pin bandwidth, one 256-bit
# beat/cycle at 100 MHz = 3.2 GB/s. Ridge AI = 51.2 / 3.2 = 16 FLOP/byte.

hardware:
  peak_compute_gflops: 51.2          # M*N*2*clk (benchmark_data.csv: peak_throughput)
  peak_bandwidth_name: "AXIS pin BW"
  peak_bandwidth_gbs: 3.2            # 256-bit @ 100 MHz (benchmark_data.csv: pin_bandwidth)

plot:
  title: "M4 roofline: 16x16 systolic array @ 100 MHz (Conv2d 5-1)"
  output: "roofline_final.png"
  ai_min: 0.1
  ai_max: 1000

points:
  # Required: the MEASURED accelerator operating point (not the M1 hypothetical).
  - name: "Accel measured"
    ai_flops_per_byte: 0.919        # benchmark_data.csv: effective_ai
    performance_gflops: 0.115       # benchmark_data.csv: sustained_throughput
    color: "tab:blue"
    marker: "o"
  # Required: the software baseline point.
  - name: "SW baseline (CPU conv)"
    ai_flops_per_byte: 144.17       # benchmark_data.csv: ideal_ai (fp32, no reuse)
    performance_gflops: 380.285     # benchmark_data.csv: cpu_conv_throughput
    color: "tab:red"
    marker: "s"
  # Context: where the accelerator would sit with perfect weight reuse.
  - name: "Accel ideal reuse"
    ai_flops_per_byte: 144.17
    performance_gflops: 51.2        # compute-bound at the peak roof
    color: "tab:green"
    marker: "^"
  # Projection only (NOT built): pixel-block streaming would raise AI ~0.92 ->
  # ~8.2; below the ridge (16) it stays memory-bound at AI * pin BW.
  - name: "Streaming (projected, not built)"
    ai_flops_per_byte: 8.2
    performance_gflops: 26.24       # 8.2 * 3.2 GB/s
    color: "tab:orange"
    marker: "*"
