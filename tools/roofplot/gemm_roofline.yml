    ai_flops_per_byte: 0.25
    performance_gflops: 871.4
    color: "tab:red"
    marker: "o"
  - name: "gemm_tiled"
    ai_flops_per_byte: 1.99
    performance_gflops: 933.3
    color: "tab:blue"
    marker: "s"
