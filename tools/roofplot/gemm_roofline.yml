  peak_bandwidth_name: "VRAM"
  peak_bandwidth_gbs: 288
  secondary_bandwidth:
    name: "L2 cache"
    peak_bandwidth_gbs: 1200

plot:
  title: "GPU Roofline"
  output: "gemm_roofline.png"
  ai_min: 0.1
  ai_max: 200

points:
